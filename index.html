<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05050a" />
    <meta name="robots" content="index, follow" />

    <title>Galaxy Simulator</title>
    <meta
      name="description"
      content="Interactive galactic structure and kinematics simulator: spiral, barred, and elliptical, with real physics behind it — rotation curves, dark matter, density waves, and stellar classification."
    />

    <!-- Open Graph. The page itself localizes at runtime (browser-language
         detected, no switcher), but this static snapshot can only be one
         language for crawlers that don't run JS — English, matching the
         app's own fallback language. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Galaxy Simulator" />
    <meta
      property="og:description"
      content="Interactive simulation of galactic structure and kinematics: spiral, barred, and elliptical, with real physics behind it."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Galaxy Simulator" />
    <meta
      name="twitter:description"
      content="Interactive simulation of galactic structure and kinematics: spiral, barred, and elliptical, with real physics behind it."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
